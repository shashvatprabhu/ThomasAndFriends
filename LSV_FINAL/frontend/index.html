<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LSV Potentiostat Control</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Oswald', sans-serif;
      background-color: #f8f9fa;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
      color: #2c3e50;
    }

    .card {
      margin-bottom: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .btn {
      margin: 5px;
    }

    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .status-connected {
      background-color: #27ae60;
    }

    .status-disconnected {
      background-color: #e74c3c;
    }

    #chart-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>LSV Potentiostat Control</h1>
      <p>Electrochemical Analysis System</p>
    </div>

    <div class="row">
      <div class="col-md-4">
        <div class="card">
          <div class="card-header">
            <h5>System Status</h5>
          </div>
          <div class="card-body">
            <div class="mb-3">
              <strong>Connection:</strong> 
              <span id="connection-status">
                <span class="status-indicator status-disconnected"></span>
                Disconnected
              </span>
            </div>
            <div class="mb-3">
              <strong>Device:</strong> ESP32-LSV Potentiostat
            </div>
            <div class="mb-3">
              <strong>Free Heap:</strong> <span id="free-heap">--</span> KB
            </div>
            <div class="mb-3">
              <strong>Measurement Points:</strong> <span id="num-points">0</span>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h5>Controls</h5>
          </div>
          <div class="card-body">
            <button id="start-scan-btn" class="btn btn-primary">Start Scan</button>
            <button id="refresh-data-btn" class="btn btn-secondary">Refresh Data</button>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h5>Recent Results</h5>
          </div>
          <div class="card-body">
            <div class="mb-2">
              <strong>Copper Peak:</strong> <span id="copper-peak">--</span>
            </div>
            <div class="mb-2">
              <strong>Silver Peak:</strong> <span id="silver-peak">--</span>
            </div>
            <div class="mb-2">
              <strong>Estimated Karat:</strong> <span id="estimated-karat">--</span>
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-8">
        <div id="chart-container">
          <h5>LSV Scan Results</h5>
          <canvas id="lsv-chart" width="400" height="300"></canvas>
        </div>
      </div>
    </div>

    <div class="row mt-4">
      <div class="col-12">
        <div class="card">
          <div class="card-header">
            <h5>System Logs</h5>
          </div>
          <div class="card-body">
            <div id="logs" style="height: 200px; overflow-y: scroll; background-color: #f1f1f1; padding: 10px; border-radius: 4px;">
              <!-- Logs will appear here -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Chart.js for plotting -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Chart initialization
    const ctx = document.getElementById('lsv-chart').getContext('2d');
    let chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Current (μA)',
          data: [],
          borderColor: 'rgb(75, 192, 192)',
          tension: 0.1,
          fill: false
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: {
            title: {
              display: true,
              text: 'Voltage (V)'
            }
          },
          y: {
            title: {
              display: true,
              text: 'Current (μA)'
            }
          }
        }
      }
    });

    // API endpoints
    const API_BASE = window.location.origin;
    const endpoints = {
      lsvData: API_BASE + '/api/v1/lsv_data',
      triggerScan: API_BASE + '/api/v1/trigger_scan',
      systemInfo: API_BASE + '/api/v1/system_info'
    };

    // DOM elements
    const connectionStatus = document.getElementById('connection-status');
    const freeHeap = document.getElementById('free-heap');
    const numPoints = document.getElementById('num-points');
    const startScanBtn = document.getElementById('start-scan-btn');
    const refreshDataBtn = document.getElementById('refresh-data-btn');
    const logsDiv = document.getElementById('logs');

    // Add log message
    function addLog(message) {
      const timestamp = new Date().toLocaleTimeString();
      const logEntry = document.createElement('div');
      logEntry.textContent = `[${timestamp}] ${message}`;
      logsDiv.appendChild(logEntry);
      logsDiv.scrollTop = logsDiv.scrollHeight; // Auto-scroll to bottom
    }

    // Update system info
    async function updateSystemInfo() {
      try {
        const response = await fetch(endpoints.systemInfo);
        const data = await response.json();
        
        if (response.ok) {
          freeHeap.textContent = Math.round(data.free_heap / 1024);
          document.querySelector('.status-indicator').className = 'status-indicator status-connected';
          document.querySelector('#connection-status').innerHTML = 
            '<span class="status-indicator status-connected"></span> Connected';
          addLog('System info updated');
        } else {
          throw new Error('Failed to fetch system info');
        }
      } catch (error) {
        document.querySelector('.status-indicator').className = 'status-indicator status-disconnected';
        document.querySelector('#connection-status').innerHTML = 
          '<span class="status-indicator status-disconnected"></span> Disconnected';
        addLog('Error fetching system info: ' + error.message);
      }
    }

    // Update LSV data
    async function updateLsvData() {
      try {
        const response = await fetch(endpoints.lsvData);
        const data = await response.json();
        
        if (response.ok) {
          numPoints.textContent = data.num_points;
          
          // Update the chart
          if (data.voltage && data.current && data.num_points > 0) {
            // Take every 5th point for better visualization (for large datasets)
            const step = Math.max(1, Math.floor(data.num_points / 100));
            const voltageData = [];
            const currentData = [];
            
            for (let i = 0; i < data.num_points; i += step) {
              voltageData.push(data.voltage[i].toFixed(3));
              currentData.push((data.current[i] * 1000000).toFixed(2)); // Convert to μA
            }
            
            chart.data.labels = voltageData;
            chart.data.datasets[0].data = currentData;
            chart.update();
          }
          
          addLog('LSV data updated');
        } else {
          throw new Error('Failed to fetch LSV data');
        }
      } catch (error) {
        addLog('Error fetching LSV data: ' + error.message);
      }
    }

    // Trigger a scan
    async function triggerScan() {
      try {
        startScanBtn.disabled = true;
        startScanBtn.textContent = 'Scanning...';
        
        const response = await fetch(endpoints.triggerScan, {
          method: 'POST'
        });
        const data = await response.json();
        
        if (response.ok) {
          addLog('Scan triggered: ' + data.message);
        } else {
          throw new Error(data.message || 'Failed to trigger scan');
        }
      } catch (error) {
        addLog('Error triggering scan: ' + error.message);
      } finally {
        startScanBtn.disabled = false;
        startScanBtn.textContent = 'Start Scan';
      }
    }

    // Initial data load and periodic updates
    updateSystemInfo();
    updateLsvData();
    
    // Set up periodic updates
    setInterval(updateSystemInfo, 10000); // Every 10 seconds
    setInterval(updateLsvData, 5000); // Every 5 seconds

    // Event listeners
    startScanBtn.addEventListener('click', triggerScan);
    refreshDataBtn.addEventListener('click', updateLsvData);

    addLog('Page loaded, connecting to LSV Potentiostat...');
  </script>
</body>

</html>
