<!DOCTYPE html>
<html>
<head>
    <title>Video Test</title>
</head>
<body>
    <h1>Direct Video Test</h1>
    <video id="test" controls style="width: 640px; height: 480px; background: black;">
        Your browser does not support video.
    </video>

    <script>
        const video = document.getElementById('test');
        video.src = 'http://localhost:5000/uploads/demo_cooling_3.mp4';
        video.load();

        video.onerror = function(e) {
            console.error('Error:', e);
            document.body.innerHTML += '<p style="color:red">VIDEO ERROR: ' + video.error.code + '</p>';
        };

        video.onloadeddata = function() {
            console.log('Video loaded!');
            document.body.innerHTML += '<p style="color:green">VIDEO LOADED SUCCESSFULLY!</p>';
        };
    </script>
</body>
</html>
