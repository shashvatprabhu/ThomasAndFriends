; PlatformIO Project Configuration File
; LSV Potentiostat for Gold Purity Analysis
; Smart India Hackathon 2025

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Configuration
monitor_speed = 115200
monitor_filters =
    default
    time

; Upload Configuration
upload_speed = 115200

; Library Dependencies
lib_deps =
    adafruit/Adafruit ADS1X15@^2.4.0
    adafruit/Adafruit MCP4725@^2.0.0
    adafruit/Adafruit BusIO@^1.14.1

; Build Flags
build_flags =
    -D ARDUINO_ARCH_ESP32
    -D CONFIG_ARDUHAL_LOG_COLORS
    -Wall

; Debugging (optional)
; debug_tool = esp-prog
; debug_init_break = tbreak setup

; Board-specific settings
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio

; Partition scheme (use default for most applications)
board_build.partitions = default.csv

; Extra Scripts (optional - for custom build steps)
; extra_scripts =
;     pre:scripts/prebuild.py
;     post:scripts/postbuild.py
